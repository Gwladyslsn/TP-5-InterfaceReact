services:

  api:
    image: node
    container_name: api_task
    environment:
      - db_host=${db_host}
      - db_name=${db_name}
      - db_user=${db_user}
      - db_password=${db_password}
    ports:
      - 8000:80
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
  
  db:
    image: postgres:18-alpine
    container_name: postgre_task
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - ./db_init:/var/lib/postgre